<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Student Dashboard - Focus Library{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body>

<div class="admin-dash">


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container-fluid nav-box">

            <a class="navbar-brand"
               href="{{ url_for('student_dashboard') }}">

                <i class="fa-solid fa-book-open"></i>

                Focus Library

            </a>


            <div class="admin-logout">

                <p>

                    <i class="fa-solid fa-user-graduate"></i>

                    {{ session.get('student_name', 'Student') }}

                </p>


                <button
                    class="btn btn-outline-success"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#studentLogoutModal">

                    Logout

                </button>


                <!-- LOGOUT MODAL -->

                <div class="modal fade"
                     id="studentLogoutModal"
                     tabindex="-1">

                    <div class="modal-dialog">

                        <div class="modal-content">

                            <div class="modal-header">

                                <h5 class="modal-title">
                                    Confirm Logout
                                </h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal">
                                </button>

                            </div>


                            <div class="modal-body">

                                Are you sure you want to logout?

                            </div>


                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">

                                    Cancel

                                </button>

                                <a href="{{ url_for('student_logout') }}"
                                   class="btn btn-danger">

                                    Logout

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </nav>


    <div class="line"></div>


    <!-- MAIN -->

    <div class="admin-main">


        <!-- SIDEBAR -->

        <div class="left-admin">

            <ul class="admin-menu">


                <li>

                    <a href="{{ url_for('student_dashboard') }}">

                        <h4>
                            <i class="fa-solid fa-house"></i>
                            Dashboard
                        </h4>

                    </a>

                </li>


                <li>

                    <a href="{{ url_for('student_profile') }}">

                        <h4>
                            <i class="fa-solid fa-user"></i>
                            My Profile
                        </h4>

                    </a>

                </li>


                <li>

                    <a href="{{ url_for('student_payment_history') }}">

                        <h4>
                            <i class="fa-solid fa-rupee-sign"></i>
                            Payment History
                        </h4>

                    </a>

                </li>


                <li>

                    <a href="{{ url_for('student_visit_history') }}">

                        <h4>
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            Entry History
                        </h4>

                    </a>

                </li>


                <li>

                    <a href="{{ url_for('student_seats') }}">

                        <h4>
                            <i class="fa-solid fa-chair"></i>
                            Available Seats
                        </h4>

                    </a>

                </li>


            </ul>

        </div>


        <!-- CONTENT -->

        <div class="right-admin">

            {% block content %}
            {% endblock %}

        </div>


    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
